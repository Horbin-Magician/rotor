[workspace]
resolver = "2"

[package]
name = "rotor-gpui-probe"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui-kit = { version = "=0.6.0", default-features = false, features = ["component", "assets"] }
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
resvg = "=0.45.1"
anyhow = "=1.0.102"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
global-hotkey = "=0.7.0"
tray-icon = "=0.21.3"
async-channel = "=2.5.0"

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "=0.6.2"
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
debug = 0
strip = "debuginfo"
