name: native-publish-draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing native version tag to build as a draft release'
        required: true
        type: string
      platforms:
        description: 'Platforms to include in this native release'
        required: true
        type: choice
        default: both
        options: [windows, both, macos]
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: native-release-${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0
      - id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
        run: |
          python3 - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']
          tag = os.environ['RELEASE_TAG']
          if tag != f'v{version}':
              raise SystemExit('Tag must match the root workspace version')
          notes = Path('doc/releases') / f'{version}.md'
          if not notes.is_file() or not notes.read_text(encoding='utf-8').strip():
              raise SystemExit('Release notes must exist and be nonempty before building')
          commit = subprocess.check_output(['git', 'rev-parse', f'refs/tags/{tag}^{{commit}}'], text=True).strip()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if commit != head:
              raise SystemExit('Checkout differs from the requested tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\nversion={version}\n')
          PY
  build-native:
    needs: validate
    uses: ./.github/workflows/native-candidate.yml
    with:
      checkout_ref: ${{ needs.validate.outputs.tag }}
      platforms: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'both' }}
      production_identity: true
      test_installation: false
      sign_updates: true
    secrets: inherit
  draft:
    needs: [validate, build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
      SELECTED_PLATFORMS: ${{ github.event_name == 'workflow_dispatch' && inputs.platforms || 'both' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          pattern: native-candidate-production-*
          path: collected
      - uses: actions/download-artifact@v4
        with:
          name: native-update-signed
          path: update-metadata
      - name: Verify package inventories and collect draft attachments
        run: |
          python3 .github/scripts/test-prepare-native-draft.py
          python3 .github/scripts/prepare-native-draft.py --source collected --output release-assets \
            --version "$RELEASE_VERSION" --platforms "$SELECTED_PLATFORMS" \
            --update-manifest update-metadata/native-update.json \
            --asset-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG"
          cp "doc/releases/$RELEASE_VERSION.md" notes.txt
      - name: Create an unpublished native release draft
        run: |
          set -euo pipefail
          flags=(--draft --verify-tag)
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "${flags[@]}" \
            --title "$RELEASE_TAG" --notes-file notes.txt release-assets/*
