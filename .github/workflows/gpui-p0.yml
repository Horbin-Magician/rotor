name: gpui-p0
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/gpui-probe/**'
      - '.github/workflows/gpui-p0.yml'
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: experiments/gpui-probe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: experiments/gpui-probe
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Reject web runtimes in native dependency closure
        shell: pwsh
        run: ./scripts/check-dependencies.ps1 -Target '${{ matrix.target }}'
      - name: macOS app layout (unsigned)
        if: runner.os == 'macOS'
        run: sh packaging/macos.sh
      - name: Windows installer (unsigned)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files (x86)/NSIS/makensis.exe')) {
            choco install nsis --version=3.11 -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          }
          ./scripts/package-windows.ps1 -Target '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        with:
          name: gpui-p0-${{ matrix.target }}
          path: experiments/gpui-probe/artifacts/
# CI build/package evidence does not certify GUI, IME, DPI, Spaces or upgrades.
