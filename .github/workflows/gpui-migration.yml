name: gpui-migration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'native/**'
      - 'xtask/**'
      - 'src-tauri/**'
      - '.github/workflows/gpui-migration.yml'
      - '.github/workflows/sync-to-gitee.yml'
      - '.github/workflows/native-candidate.yml'
      - '.github/scripts/**'
permissions:
  contents: read
jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/test-prepare-gitee-release.py
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - shell: pwsh
        run: ./.github/scripts/check-annotation-font.ps1
      - run: cargo fmt -p rotor-desktop -p rotor-ui -p rotor-canvas -p rotor-common -p rotor-updater -p xtask -- --check
      - run: cargo test -p rotor-common -p rotor-canvas -p rotor-runtime -p rotor-searcher -p rotor-screenshot -p rotor-translator -p rotor-ui -p rotor-desktop -p rotor-updater -p xtask --locked
      - shell: pwsh
        run: ./.github/scripts/check-core-dependencies.ps1
      - run: cargo clippy --no-deps -p rotor-desktop -p rotor-ui -p rotor-canvas -p rotor-runtime -p rotor-updater -p xtask --all-targets --locked -- -D warnings
      - run: cargo run -p xtask --locked -- build
      - run: cargo run -p xtask -- stage "${{ runner.temp }}/native-stage"
      - run: cargo run -p xtask -- verify "${{ runner.temp }}/native-stage"
      - run: tar -czf "${{ runner.temp }}/native-stage.tar.gz" -C "${{ runner.temp }}/native-stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: native-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/native-stage.tar.gz
      - run: cargo run -p rotor-desktop --example ocr_smoke --release --locked -- --wait-idle
      - run: cargo run -p rotor-screenshot --example profile_roundtrip --locked -- "${{ runner.temp }}/profile-roundtrip"
  legacy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: yarn
      - uses: swatinem/rust-cache@v2
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: cargo check -p rotor --locked
