name: native-checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/**'
      - 'native/**'
      - 'xtask/**'
      - 'assets/**'
      - '.cargo/**'
      - '.gitattributes'
      - '.github/workflows/native-checks.yml'
      - '.github/workflows/sync-to-gitee.yml'
      - '.github/workflows/native-candidate.yml'
      - '.github/scripts/**'
permissions:
  contents: read
jobs:
  release-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/test-prepare-gitee-release.py
      - run: python3 .github/scripts/test-prepare-native-draft.py
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - shell: pwsh
        run: ./.github/scripts/check-annotation-font.ps1
      - run: cargo fmt --all -- --check
      # Standalone builds must not borrow AppKit features from desktop dependencies.
      - run: cargo check -p rotor-platform --locked
      - run: cargo check --workspace --locked
      - run: cargo test --workspace --locked
      - shell: pwsh
        run: ./.github/scripts/check-core-dependencies.ps1
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo run -p xtask --locked -- build
      - run: cargo run -p xtask -- stage "${{ runner.temp }}/native-stage"
      - run: cargo run -p xtask -- verify "${{ runner.temp }}/native-stage"
      - run: tar -czf "${{ runner.temp }}/native-stage.tar.gz" -C "${{ runner.temp }}/native-stage" .
      - uses: actions/upload-artifact@v4
        with:
          name: native-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/native-stage.tar.gz
      - run: cargo run -p rotor-desktop --example ocr_smoke --release --locked -- --wait-idle
      - run: cargo run -p rotor-screenshot --example profile_roundtrip --locked -- "${{ runner.temp }}/profile-roundtrip"
