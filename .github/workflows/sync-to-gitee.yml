name: 'sync-to-gitee'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Exact published GitHub release tag to mirror'
        required: true
        type: string
  release:
    types: [published]

concurrency:
  group: gitee-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_OWNER: ${{ secrets.GITEE_OWNER }}
      GITEE_REPO: ${{ secrets.GITEE_REPO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test metadata preparation
        run: python .github/scripts/test-prepare-gitee-release.py
      - name: Read the exact published release
        run: |
          set -euo pipefail
          test -n "$RELEASE_TAG"
          ENCODED_TAG=$(python -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["RELEASE_TAG"], safe=""))')
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$ENCODED_TAG" > release-info.json
          python .github/scripts/prepare-gitee-release.py --release release-info.json --tag "$RELEASE_TAG"
      - name: Download and verify all release assets
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download --repo "$GITHUB_REPOSITORY" --dir release-assets -- "$RELEASE_TAG"
          python .github/scripts/prepare-gitee-release.py \
            --release release-info.json --tag "$RELEASE_TAG" --assets release-assets \
            --github-repo "$GITHUB_REPOSITORY" --gitee-owner "$GITEE_OWNER" \
            --gitee-repo "$GITEE_REPO" --output gitee-release.json
      - name: Mirror repository to Gitee
        uses: wearerequired/git-mirror-action@v1.2.0
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        with:
          source-repo: git@github.com:${{ github.repository }}.git
          destination-repo: ${{ secrets.GITEE_REPO_URL }}
      - name: Create Gitee release and upload exact assets
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # Release text is JSON data throughout; it is never interpolated as shell code.
          # Creation errors (including an existing release) stop before uploading.
          jq --arg token "$GITEE_ACCESS_TOKEN" '. + {access_token: $token}' gitee-release.json |
            curl --fail --silent --show-error \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases" \
              -H 'Content-Type: application/json' --data-binary @- > gitee-created.json
          RELEASE_ID=$(jq -er '.id | numbers' gitee-created.json)
          for file in release-assets/*; do
            curl --fail --silent --show-error \
              "https://gitee.com/api/v5/repos/$GITEE_OWNER/$GITEE_REPO/releases/$RELEASE_ID/attach_files" \
              --form-string "access_token=$GITEE_ACCESS_TOKEN" --form "file=@$file" --output /dev/null
          done
