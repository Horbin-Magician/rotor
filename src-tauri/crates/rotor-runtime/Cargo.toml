[package]
name = "rotor-runtime"
version = "2.6.0"
edition = "2021"

[dependencies]
global-hotkey = "=0.7.0"
image = "0.25.6"
log = "0.4.27"
rotor-common = { path = "../rotor-common" }
rotor-screenshot = { path = "../rotor-screenshot" }
rotor-searcher = { path = "../rotor-searcher" }
rotor-translator = { path = "../rotor-translator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
