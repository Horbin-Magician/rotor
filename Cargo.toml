[workspace]
resolver = "2"
exclude = ["native/block", "native/gpui-platform", "native/gpui-macos"]
members = [
  "crates/rotor-common",
  "crates/rotor-platform",
  "crates/rotor-searcher",
  "crates/rotor-screenshot",
  "crates/rotor-runtime",
  "crates/rotor-translator",
  "crates/rotor-desktop",
  "crates/rotor-ui",
  "crates/rotor-canvas",
  "crates/rotor-updater",
  "xtask",
]
default-members = ["crates/rotor-desktop"]

[workspace.package]
version = "3.0.2"

[workspace.dependencies]
gpui-kit = { version = "=0.6.1", default-features = false, features = ["component", "assets"] }
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
rotor-common = { path = "crates/rotor-common" }
rotor-runtime = { path = "crates/rotor-runtime" }
rotor-platform = { path = "crates/rotor-platform" }
rotor-ui = { path = "crates/rotor-ui" }
rotor-canvas = { path = "crates/rotor-canvas" }
rotor-updater = { path = "crates/rotor-updater" }
rotor-searcher = { path = "crates/rotor-searcher" }
rotor-screenshot = { path = "crates/rotor-screenshot" }
rotor-translator = { path = "crates/rotor-translator" }
async-channel = "=2.5.0"
futures = "0.3"
futures-util = "0.3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
log = "0.4.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8.23"
tempfile = "=3.27.0"
tokio = { version = "1", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
url = "2.5"
semver = "1"
sha2 = "0.10"
global-hotkey = "=0.7.0"
raw-window-handle = "=0.6.2"
plist = "=1.9.0"
libc = "=0.2.186"
tar = "=0.4.46"
flate2 = "=1.1.9"
# Per-crate Win32 feature lists stay local; only the version is shared.
windows = "0.61.3"
winreg = "=0.55.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[patch.crates-io]
block = { path = "native/block" }
gpui-pre-platform = { path = "native/gpui-platform" }
gpui-pre-macos = { path = "native/gpui-macos" }
