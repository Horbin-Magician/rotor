[workspace]
resolver = "2"
members = [
  "src-tauri",
  "src-tauri/crates/rotor-common",
  "src-tauri/crates/rotor-platform",
  "src-tauri/crates/rotor-searcher",
  "src-tauri/crates/rotor-screenshot",
  "src-tauri/crates/rotor-runtime",
  "src-tauri/crates/rotor-translator",
  "crates/rotor-desktop",
  "crates/rotor-ui",
  "crates/rotor-canvas",
]
default-members = ["crates/rotor-desktop"]
exclude = ["experiments/gpui-probe"]

[workspace.dependencies]
gpui-kit = { version = "=0.6.0", default-features = false, features = ["component", "assets"] }
gpui = { package = "gpui-pre", version = "=0.3.3" }
gpui-platform = { package = "gpui-pre-platform", version = "=0.3.3" }
rotor-common = { path = "src-tauri/crates/rotor-common" }
rotor-runtime = { path = "src-tauri/crates/rotor-runtime" }
rotor-ui = { path = "crates/rotor-ui" }
rotor-canvas = { path = "crates/rotor-canvas" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
