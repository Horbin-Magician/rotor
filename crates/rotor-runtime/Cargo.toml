[package]
name = "rotor-runtime"
version.workspace = true
edition = "2021"

[dependencies]
async-channel = "=2.5.0"
global-hotkey = "=0.7.0"
image.workspace = true
log = "0.4.27"
rotor-common = { path = "../rotor-common" }
rotor-canvas = { path = "../rotor-canvas" }
rotor-updater.workspace = true
rotor-platform = { path = "../rotor-platform" }
rotor-screenshot = { path = "../rotor-screenshot" }
rotor-searcher = { path = "../rotor-searcher" }
rotor-translator = { path = "../rotor-translator" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net"] }

[dev-dependencies]
tempfile = "=3.27.0"
