[package]
name = "rotor-searcher"
version.workspace = true
edition = "2021"

[dependencies]
fxhash = "0.2.1"
log.workspace = true
sha2.workspace = true
notify = "8.2.0"
pinyin = { version = "0.11.0", default-features = false, features = ["plain"] }
rotor-common.workspace = true
rotor-platform.workspace = true
image.workspace = true
walkdir = "2.5.0"

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
windows = { workspace = true, features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[target."cfg(target_os = \"windows\")".dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_Ioctl",
] }
